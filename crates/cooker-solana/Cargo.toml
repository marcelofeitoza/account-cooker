[package]
name = "cooker-solana"
description = "Surfpool-only Solana gateway and action adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22.1"
bincode = "1.3.3"
chrono.workspace = true
cooker-core = { version = "0.1.0", path = "../cooker-core" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
solana-hash = { version = "4.5.0", features = ["decode"] }
solana-address-lookup-table-interface = { version = "3.1.0", features = ["bincode", "bytemuck"] }
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.3.0"
solana-program-pack = "3.1.0"
solana-pubkey = "4.2.0"
solana-signature = { version = "3.4.1", features = ["verify"] }
solana-signer = "3.0.1"
solana-stake-interface = { version = "3.1.0", features = ["bincode"] }
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = { version = "4.1.5", features = ["serde", "wincode"] }
spl-associated-token-account-interface = "2.0.0"
spl-token-interface = "3.0.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
url.workspace = true
zeroize = "1.8.2"

[dev-dependencies]
cooker-runtime = { version = "0.1.0", path = "../cooker-runtime" }
cooker-store = { version = "0.1.0", path = "../cooker-store" }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
wiremock = "0.6.5"
uuid.workspace = true

[lints]
workspace = true
